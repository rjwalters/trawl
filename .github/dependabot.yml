version: 2

updates:
  # GitHub Actions (currently actions/checkout@v7 and actions/setup-node@v7 in
  # ci.yml). Grouped into a single PR, majors included: action bumps are
  # low-risk and reviewing them one-by-one is pure noise.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 14
    labels:
      - "tier:maintenance"   # org policy names `dependencies`, which doesn't exist here
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  # Runtime dependencies. Minor and patch bumps are grouped into one PR;
  # majors deliberately are NOT. playwright-core is excluded from the group
  # even at minor/patch: it is coupled to the browser binary and carries the
  # most rendering risk here, so every bump arrives as its own reviewable PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 14
    labels:
      - "tier:maintenance"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["playwright-core"]
        update-types: ["minor", "patch"]
